# ─────────────────────────────────────────────────────────────────
#  application-prod.properties — loaded when SPRING_PROFILES_ACTIVE=prod
#  All secrets come from environment variables — nothing hardcoded here
# ─────────────────────────────────────────────────────────────────

# Server — Render.com sets $PORT automatically
server.port=${PORT:8080}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=604800000

# CORS — only allow the real frontend URL
cors.allowed-origins=${FRONTEND_URL}

# Actuator — expose only health for Render health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging — INFO in production (no DEBUG output)
logging.level.root=INFO
logging.level.com.zulugshop=INFO
logging.level.org.springframework.security=WARN

# MongoDB auditing
spring.data.mongodb.auto-index-creation=false
