server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json image/svg+xml;

    # ── React Router — all routes fall back to index.html ─────────
    # Without this, refreshing on /products/123 returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Aggressive caching for hashed Vite assets ─────────────────
    # Vite appends content hashes (e.g. main.abc123.js) so safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Never cache index.html ────────────────────────────────────
    # Ensures new deployments are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
