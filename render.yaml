# ─────────────────────────────────────────────────────────────────
#  render.yaml — ZuluGshop Infrastructure as Code for Render.com
# ─────────────────────────────────────────────────────────────────

services:

  # ── Backend: Spring Boot REST API ────────────────────────────
  - type: web
    name: zulugshop-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                 
    region: singapore           
    branch: main
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 8080

      - key: MONGODB_URI
        sync: false             # Set this manually in the Render Dashboard

      - key: JWT_SECRET
        sync: false             # Set this manually in the Render Dashboard

      - key: JWT_EXPIRATION
        value: 86400000         # 24 hours in ms

      - key: FRONTEND_URL
        # We hardcode this to ensure the "https://" prefix is present for CORS
        value: https://zulugshop-frontend.onrender.com

      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # ── Frontend: React + Nginx ───────────────────────────────────
  - type: web
    name: zulugshop-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    
    envVars:
      # React builds are static; VITE_API_URL must be available at build time.
      # Render's Free Tier URLs are predictable: [service-name].onrender.com
      - key: VITE_API_URL
        value: https://zulugshop-backend.onrender.com