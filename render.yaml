# ─────────────────────────────────────────────────────────────────
#  render.yaml — ZuluGshop Infrastructure as Code
# ─────────────────────────────────────────────────────────────────

services:

  # ── Backend: Spring Boot ──────────────────────────────────────
  - type: web
    name: zulugshop-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        value: https://zulugshop-frontend.onrender.com
      
      # Database Configuration
      - key: MONGODB_URI
        value: mongodb+srv://rizsameer001_db_user:apyzUNvvS0p0318K@cluster0.xbnnnsq.mongodb.net/springbootzuluecom
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb+srv://rizsameer001_db_user:apyzUNvvS0p0318K@cluster0.xbnnnsq.mongodb.net/springbootzuluecom

      # Note: You should still set JWT_SECRET manually for security, 
      # or add it here if you want it fully automated:
      - key: JWT_SECRET
        value: "your-very-secret-key-here" 
      - key: JWT_EXPIRATION
        value: 86400000

  # ── Frontend: React + Nginx ───────────────────────────────────
  - type: web
    name: zulugshop-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://zulugshop-backend.onrender.com